name: PR Checks

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run lightweight Lighthouse (headless)
        run: |
          echo "Skipping full LHCI in CI by default. To enable, add LHCI secrets and uncomment commands." 
          # Placeholder: a real LHCI run requires setup and may need secrets; left as comment intentionally
